<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Stundl Student Client</title><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex">
<style>
:root{--bg:#f3f5fb;--surface:#fff;--surface2:#eef1f8;--text:#131826;--muted:#667085;--line:#e3e7f0;--accent:#4f46e5;--on:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--side:#fff;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 22px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--surface:#141a26;--surface2:#1b2332;--text:#eef1f8;--muted:#98a3b7;--line:#252f43;--accent:#8e90ff;--on:#0b0f17;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--side:#0f1420;--shadow:0 10px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}
aside b{display:block;padding:4px 10px 14px;font-size:17px}aside small{color:var(--muted);font-weight:400;display:block}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;padding:9px 12px;border-radius:10px;cursor:pointer}
nav button:hover{background:var(--surface2)}nav button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:650}
aside .back{margin-top:14px;padding:0 10px;font-size:14px}aside a{color:var(--accent);text-decoration:none}
main{padding:26px 32px 70px;max-width:980px}h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}.sub{color:var(--muted);margin:0 0 22px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:26px 2px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
button.b{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--accent);color:var(--on);border-color:transparent}button.d{color:var(--bad)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2)}.tag.admin{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
code{background:var(--surface2);padding:2px 7px;border-radius:6px;font-size:.92em;word-break:break-all}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0;font-size:14px;display:none}.msg.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent)}.msg.err{display:block;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){#app{display:block}aside{position:static;height:auto}main{padding:18px}.grid2{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap}nav button{width:auto}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tile small{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}.tile b{font-size:24px;letter-spacing:-.02em}.tile span{font-size:12.5px;color:var(--muted)}
.tile.warn b{color:#dc2626}
.logbox{white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:380px;overflow:auto;margin:10px 0 0}
label.filebtn{cursor:pointer;display:inline-flex;align-items:center}
</style></head><body>
<div id="app"><aside><b>SSC Server<small id="ver"></small></b><nav id="nav"></nav><div class="back"><a href="/">← Back to the app</a><br><br><a href="#" onclick="logout()">Log out</a></div></aside>
<main><div id="msg" class="msg"></div><div id="page">Loading…</div></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,b)=>{const r=await fetch(p,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch(e){}
  if(r.status===403||r.status===401){location.href="/";throw 0}if(!r.ok){throw new Error(j.error||("HTTP "+r.status))}return j};
const say=(t,ok=true)=>{const m=$("#msg");m.className="msg "+(ok?"ok":"err");m.textContent=t;if(ok)setTimeout(()=>m.className="msg",5000)};
const run=async(f,okmsg)=>{try{await f();if(okmsg)say(okmsg);await show(tab)}catch(e){if(e)say(e.message,false)}};
let S=null,C=null,tab="Overview";const TABS=["Overview","Accounts","Children","Network","Web & links","SSH","Power","System","Notifications","WebUntis","Activity"];
const when=t=>t?new Date(t*1000).toLocaleString("en-GB"):"never";
async function logout(){await api("/api/logout",{});location.href="/"}
async function show(t){tab=t;[S,C]=await Promise.all([api("/api/admin/status"),api("/api/admin/config")]);
  $("#ver").textContent="v"+S.version+" · up "+Math.round(S.uptime/60)+" min";
  $("#nav").innerHTML=TABS.map(x=>`<button class="${x===t?"on":""}" onclick="show('${x}')">${x}</button>`).join("");
  $("#page").innerHTML=await PAGES[t]()}
const cfg=async(patch,msg)=>run(()=>api("/api/admin/config",patch),msg);
const chk=(id,v)=>`<input type="checkbox" id="${id}" ${v?"checked":""}>`;
const apply=()=>S.apply?`<div class="card"><b>Last system change:</b> ${esc(S.apply.ok?"applied":"problem")} · ${esc((S.apply.messages||[]).join("; "))}</div>`:"";
const PAGES={
Overview:async()=>{const H=await api("/api/admin/health").catch(()=>({alerts:[],enabled:false}));return `<h1>Overview</h1><p class="sub">Everything about this server at a glance.</p>${alertsCard(H)}
 <div class="card"><div class="kv"><span>Web address</span><b>${S.urls.map(u=>`<a href="${esc(u)}">${esc(u)}</a>`).join("<br>")||"-"}</b></div>
 <div class="kv"><span>Hostname</span><b>${esc(S.hostname)}</b></div>
 <div class="kv"><span>WebUntis</span><b>${esc(S.untis||"not connected")}</b></div>
 <div class="kv"><span>Last data update</span><b>${when(S.synced_at)}</b></div>
 <div class="kv"><span>Accounts</span><b>${S.accounts.length} (${S.accounts.filter(a=>a.role==="admin").length} admin)</b></div></div>
 <div class="row"><button class="b p" onclick="run(()=>api('/api/admin/sync',{}),'Sync started')">Sync now</button></div>${apply()}
 <h2>Updates</h2><div class="card"><div class="kv"><span>Installed version</span><b>${esc(S.version)}</b></div><div id="upd" class="sub"></div>
 <div class="row"><button class="b" onclick="chkUpd()">Check for updates</button></div>
 <div class="row"><div><label>Updates follow</label><select id="uch" onchange="cfg({update:{channel:this.value}},'Saved')"><option value="commits" ${C.update.channel==="commits"?"selected":""}>Every new commit (no release needed)</option><option value="releases" ${C.update.channel==="releases"?"selected":""}>Published releases only</option></select></div></div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("aue",C.autoupdate.enabled)} Install new versions by itself every day at</label><input id="aut" type="time" value="${esc(C.autoupdate.time)}"><button class="b p" onclick="saveAutoUpd()">Save</button></div>
 <p class="sub">${S.autoupdate?"Last automatic check: "+esc(S.autoupdate.day)+" - "+esc(S.autoupdate.result||""):"Updates come from this project's GitHub releases."} Only a commit whose automatic tests passed is installed by itself. If a new version does not start, the old one is put back at once (and that version is not tried again). By hand: <code>ssconfig update --rollback</code>.</p></div>
 <h2>Wall-display links</h2><div class="card">${S.links.enabled?(S.links.urls.map(u=>`<div class="kv"><span>${esc(u.host)}</span><div><code>${esc(u.browser)}</code><br><code>${esc(u.wall)}</code></div></div>`).join("")||"<span class='sub'>No network address yet.</span>")
 +`<div class="row"><button class="b" onclick="if(confirm('Create a new link? Displays using the old one stop working.'))run(()=>api('/api/admin/links/rotate',{}),'New link created')">New link</button>
 <span class="sub">${S.links.long?"Long links required (64 characters).":"Standard links (32 characters)."} ${S.links.expired?"<b style='color:var(--bad)'>The link has expired - make a new one.</b>":S.links.expires_at?"Valid until "+when(S.links.expires_at)+".":""} Shows the first child only.</span></div>`:"<span class='sub'>Link access is turned off (Web & links).</span>"}</div>`},
Accounts:()=>`<h1>Accounts</h1><p class="sub"><b>Guest</b> and <b>user</b> accounts see the Parent view (each with its own set of sections). <b>Admins</b> get the full app and this panel.</p>
 <div class="card"><table><tr><th>Name</th><th>Role</th><th>Last sign-in</th><th></th></tr>${S.accounts.map(a=>`<tr><td>${esc(a.name)} ${a.disabled?'<span class="tag">disabled</span>':""}${limTags(a)}</td>
  <td><select onchange="run(()=>api('/api/admin/accounts/role',{name:'${esc(a.name)}',role:this.value}),'Role changed')">${["guest","user","admin"].map(r=>`<option ${r===a.role?"selected":""}>${r}</option>`).join("")}</select></td>
  <td>${when(a.last_login)}</td><td style="text-align:right;white-space:nowrap"><button class="b" onclick="newpw('${esc(a.name)}')">Password</button>${a.role!=="admin"?`<button class="b" onclick="editLimits('${esc(a.name)}')">Limits</button>`:""}
  <button class="b" onclick="run(()=>api('/api/admin/accounts/disable',{name:'${esc(a.name)}',disabled:${!a.disabled}}))">${a.disabled?"Enable":"Disable"}</button>
  <button class="b d" onclick="if(confirm('Delete ${esc(a.name)}?'))run(()=>api('/api/admin/accounts/delete',{name:'${esc(a.name)}'}),'Deleted')">Delete</button></td></tr>`).join("")}</table></div>
 ${limEditor()}
 <h2>Add an account</h2><div class="card"><div class="row"><input id="an" placeholder="name" autocomplete="off"><input id="ap" type="password" placeholder="password (min 6)" autocomplete="new-password">
  <select id="ar"><option>guest</option><option selected>user</option><option>admin</option></select><button class="b p" onclick="run(()=>api('/api/admin/accounts',{name:$('#an').value,password:$('#ap').value,role:$('#ar').value}),'Account created')">Add</button></div></div>
 <h2>What each role sees</h2><div class="card grid2">${["guest","user"].map(r=>`<div><label>${r} sections</label>${["today","timetable","homework","exams","plan","changes","grades","absences"].map(x=>`<label style="display:inline-flex;gap:6px;margin-right:10px;color:var(--text)"><input type="checkbox" data-r="${r}" value="${x}" ${C.sections[r].includes(x)?"checked":""}>${x}</label>`).join("")}</div>`).join("")}
  <div><button class="b p" onclick="saveSections()">Save</button></div></div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("gp",C.web.guest_passwordless)} Allow guests to enter without a password (a "Continue as guest" button)</label><button class="b" onclick="cfg({web:{guest_passwordless:$('#gp').checked}},'Saved')">Save</button></div>`,
Network:()=>`<h1>Network</h1><p class="sub">Careful: a wrong static address can make this server unreachable. You can always fix it on the console with <code>ssconfig</code>.</p>${apply()}
 <div class="card"><div class="row"><div><label>Hostname</label><input id="hn" value="${esc(C.network.hostname)}"></div>
 <div><label>Addressing</label><select id="nm" onchange="$('#st').style.display=this.value==='static'?'block':'none'"><option value="dhcp" ${C.network.mode==="dhcp"?"selected":""}>Automatic (DHCP)</option><option value="static" ${C.network.mode==="static"?"selected":""}>Custom IP address</option></select></div>
 <div><label>Interface</label><input id="if" value="${esc(C.network.interface)}" size="8"></div></div>
 <div id="st" style="display:${C.network.mode==="static"?"block":"none"}"><div class="row"><div><label>IP address / prefix</label><input id="ad" placeholder="192.168.1.50/24" value="${esc(C.network.address)}"></div>
 <div><label>Gateway</label><input id="gw" placeholder="192.168.1.1" value="${esc(C.network.gateway)}"></div><div><label>DNS servers</label><input id="dn" placeholder="1.1.1.1, 9.9.9.9" value="${esc(C.network.dns.join(", "))}"></div></div></div>
 <div class="row"><button class="b p" onclick="saveNet()">Save and apply</button></div></div>
 <h2>Wi-Fi</h2><div class="card">${S.wifi_card?`<p class="sub" style="margin-top:0">Wireless card: <code>${esc(S.wifi_card)}</code>. When Wi-Fi is on, the address settings above apply to it and a network cable (if any) uses DHCP. The password is never stored - only a derived key, readable by root alone.</p>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="wfe" ${C.wifi.enabled?"checked":""}> Use Wi-Fi</label></div>
 <div class="row"><div><label>Network name (SSID)</label><input id="wfs" value="${esc(C.wifi.ssid)}"></div><div><label>Password</label><input id="wfp" type="password" autocomplete="new-password" placeholder="${C.wifi.enabled&&!C.wifi.open?"unchanged":""}"></div>
 <div><label>Country</label><input id="wfc" value="${esc(C.wifi.country)}" size="3" maxlength="2" placeholder="AT"></div></div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="wfo" ${C.wifi.open?"checked":""}> Open network (no password)</label>
 <label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="wfh" ${C.wifi.hidden?"checked":""}> Hidden network</label></div>
 <div class="row"><button class="b p" onclick="saveWifi()">Save and connect</button></div>
 <p class="sub">Careful: if you change this while connected over Wi-Fi, the server may get a new address. Find it on the console with <code>ssconfig showip</code>.</p>`
 :`<p class="sub" style="margin:0">No Wi-Fi card was found in this machine.</p>`}</div>
 <h2>Current addresses</h2><div class="card">${S.addresses.map(a=>`<div class="kv"><span>${esc(a[0])}</span><b>${esc(a[1])}</b></div>`).join("")||"-"}</div>`,
"Web & links":()=>`<h1>Web & links</h1><p class="sub">The web interface and the optional sign-in-free wall-display links.</p>${apply()}
 <div class="card"><div class="row"><div><label>Web port</label><input id="wp" type="number" value="${C.web.port}" style="width:100px"></div><div><label>Listen on</label><input id="wb" value="${esc(C.web.bind)}" size="14"></div>
 <div><label>Session length (hours)</label><input id="sh" type="number" value="${C.web.session_hours}" style="width:90px"></div></div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("hs",C.web.https)} HTTPS (encrypted; a certificate is made on this machine - browsers warn once)</label></div>
 <p class="sub" style="margin:0 0 6px">After you turn HTTPS on or off the address changes to <code>https://…</code> / <code>http://…</code> on the same port. Compare the fingerprint the browser shows with the one under <b>System</b>.</p>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("fw",C.firewall.enabled)} Firewall on (only the web, link and SSH ports are open)</label></div>
 <div class="row"><button class="b p" onclick="saveWeb()">Save</button></div></div>
 <h2>Wall-display links</h2><div class="card"><div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("le",C.links.enabled)} Allow links (no sign-in)</label>
 <label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("ll",C.links.long)} Require long links (64 characters)</label>
 <div><label>Link port</label><input id="lp" type="number" value="${C.links.port}" style="width:100px"></div>
 <div><label>Links expire after (days, 0 = never)</label><input id="lx" type="number" min="0" value="${C.links.expire_days}" style="width:120px"></div><button class="b p" onclick="saveLinks()">Save</button></div></div>`,
SSH:()=>`<h1>SSH</h1><p class="sub">Remote console access for administrators. Changes are checked with <code>sshd -t</code> before they are used.</p>${apply()}
 <div class="card"><div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("se",C.ssh.enabled)} SSH enabled</label><div><label>Port</label><input id="sp" type="number" value="${C.ssh.port}" style="width:90px"></div></div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("sr",C.ssh.permit_root)} Allow the root user to log in</label>
 <label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("spw",C.ssh.password_auth)} Allow password logins (turn off to require SSH keys)</label></div>
 <div class="row"><div><label>Only these users may log in (blank = all)</label><input id="su" value="${esc(C.ssh.allow_users.join(" "))}" size="30" placeholder="admin ssc-admin"></div></div>
 <div class="row"><button class="b p" onclick="saveSsh()">Save and apply</button></div></div>
 <h2>Console login</h2><div class="card"><p class="sub" style="margin-top:0">Log in on this machine's own screen and keyboard (the text console) without typing a password. <b>Console only:</b> SSH and this web panel still always ask for a password. Anyone who can touch the machine then has that Linux account (and <code>sudo</code>). Takes effect at the next boot.</p>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("ale",!!C.console.autologin_user)} Log in automatically as</label><input id="alu" value="${esc(C.console.autologin_user)}" size="14" placeholder="Linux user, e.g. admin">
 <button class="b p" onclick="saveAuto()">Save</button></div></div>`,
Power:async()=>{const i=await api("/api/admin/system");return `<h1>Power</h1><p class="sub">For old laptops used as servers: keep running with the lid closed.</p>${apply()}
 <div class="card"><div class="row"><div><label>When the lid is closed</label><select id="pl"><option value="ignore" ${C.power.lid==="ignore"?"selected":""}>Do nothing - keep running</option><option value="suspend" ${C.power.lid==="suspend"?"selected":""}>Suspend</option><option value="poweroff" ${C.power.lid==="poweroff"?"selected":""}>Power off</option></select></div></div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("pb",C.power.block_sleep)} Never suspend or hibernate (also ignores the sleep keys and idle timeouts)</label></div>
 <div class="row"><button class="b p" onclick="savePower()">Save and apply</button></div>
 <p class="sub">With the lid closed the laptop gets warm: keep the vents free and plug it in. Whether the screen turns off with the lid is up to the laptop's hardware.</p></div>
 <h2>Sleep schedule</h2><div class="card"><p class="sub" style="margin-top:0">Switch everything off at night and back on in the morning. Times are the server's local time.</p>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("sce",C.schedule.enabled)} Use a sleep schedule</label></div>
 <div class="row"><div><label>Switch off at</label><input id="sco" type="time" value="${esc(C.schedule.off)}"></div><div><label>Switch back on at</label><input id="scn" type="time" value="${esc(C.schedule.on)}"></div>
 <div><label>Mode</label><select id="scm"><option value="quiet" ${C.schedule.mode==="quiet"?"selected":""}>Quiet: stop SSC, disks to sleep, screen off</option><option value="suspend" ${C.schedule.mode==="suspend"?"selected":""}>Suspend the machine and wake it up</option><option value="poweroff" ${C.schedule.mode==="poweroff"?"selected":""}>Power off and switch it on again</option></select></div></div>
 <div class="row">${["mon","tue","wed","thu","fri","sat","sun"].map(d=>`<label style="display:inline-flex;gap:5px;align-items:center;color:var(--text)">${chk("scd-"+d,C.schedule.days.includes(d))} ${d[0].toUpperCase()+d.slice(1)}</label>`).join(" ")}</div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("scdk",C.schedule.spin_down_disks)} Spin hard disks down (quiet mode)</label>
 <label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("scsc",C.schedule.screen_off)} Turn the console screen off (quiet mode)</label>
 <label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("scss",C.schedule.stop_ssh)} Also stop SSH (quiet mode)</label></div>
 <div class="row"><button class="b p" onclick="saveSched()">Save and apply</button></div>
 <p class="sub">In quiet mode this web page is unreachable during the sleep period (SSH stays on unless you stop it). Suspend and power-off need a hardware clock that can wake the machine (most PCs and laptops have one; some BIOS settings must allow "wake on RTC alarm"). To end a sleep period by hand: <code>ssconfig schedule up</code>.</p></div>${powerExtras(i)}`},
System:async()=>{const [i,ss]=await Promise.all([api("/api/admin/system"),api("/api/admin/sessions")]);
 const up=i.uptime_s==null?"-":(Math.floor(i.uptime_s/86400)?Math.floor(i.uptime_s/86400)+" d ":"")+Math.floor(i.uptime_s%86400/3600)+" h "+Math.floor(i.uptime_s%3600/60)+" min";
 const hot=i.temperatures.length?Math.max(...i.temperatures.map(t=>t.celsius)):null;
 const tile=(k,v,sub,warn)=>`<div class="tile ${warn?"warn":""}"><small>${k}</small><b>${v}</b><span>${sub||""}</span></div>`;
 const state=x=>`<span class="tag" style="${x==="active"?"background:#16a34a;color:#fff":x==="inactive"?"":"background:#d97706;color:#fff"}">${esc(x)}</span>`;
 return `<h1>System</h1><p class="sub">The health of this machine, its services, and what you can do to it from here.</p>

  ${i.battery?tile("Battery",i.battery.percent+"%",esc(i.battery.status)+(i.battery.ac_online?" · charger on":" · on battery"),!i.battery.ac_online&&i.battery.percent<30):""}</div>
 <h2>Machine</h2><div class="card"><div class="kv"><span>System</span><b>${esc(i.os)}</b></div><div class="kv"><span>Kernel</span><b>${esc(i.kernel)} (${esc(i.machine)})</b></div>

 <h2>Power</h2><div class="card"><div class="row"><button class="b p" onclick="powerAct('reboot')">Restart the server</button><button class="b d" onclick="powerAct('poweroff')">Power off</button></div>
  <p class="sub">A restart takes about a minute; this page reloads when the server is back. After a power-off the machine has to be switched on by hand (unless a sleep schedule wakes it).</p></div>
 <h2>Signed in now</h2><div class="card">${ss.length?`<table><tr><th>Account</th><th>Role</th><th>From</th><th>Since</th><th></th></tr>${ss.map(x=>`<tr><td>${esc(x.name)}${x.anonymous?" <small class='sub'>(guest link)</small>":""}</td><td>${esc(x.role)}</td><td>${esc(x.ip)}</td><td>${when(x.since)}</td><td style="text-align:right">${x.anonymous?"":`<button class="b" onclick="signOutAll('${esc(x.name)}')">Sign out</button>`}</td></tr>`).join("")}</table>`:"<span class='sub'>Nobody.</span>"}</div>
 <h2>Logs</h2><div class="card"><div class="row"><select id="lg"><option value="web">SSC web service</option><option value="apply">Settings helper</option><option value="sync">Data sync</option><option value="ssh">SSH</option><option value="firewall">Firewall</option><option value="network">Network</option><option value="schedule">Sleep schedule</option><option value="boot">Boot (warnings)</option></select>
  <select id="ln"><option>50</option><option selected>100</option><option>300</option></select><button class="b" onclick="showLog()">Show</button></div><pre id="logbox" class="logbox">Choose a log and press Show.</pre></div>
 <h2>Backup</h2><div class="card"><div class="row"><button class="b" onclick="downloadBackup()">Download settings</button><label class="b filebtn">Restore settings from a file<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0])"></label></div>
  <p class="sub">The backup holds the settings only (network, web, SSH, schedule, roles ...): no passwords, no accounts and no WebUntis key. Restoring checks everything first and applies the system parts.</p></div>`},
WebUntis:()=>`<h1>WebUntis</h1>${kidPick()}<p class="sub">The server logs in to WebUntis by itself with the <b>Untis Mobile</b> key (no browser, no password).</p>

 <div class="row"><div style="flex:1"><label>Option 1 - the Untis Mobile link: WebUntis → Profile → Freigaben / Access → Untis Mobile → scan the QR code with a phone camera and paste the text (starts with untis://setschool?…)</label>

Children:()=>`<h1>Children</h1><p class="sub">One server can follow several students or schools. Each has its own WebUntis key, its own data and its own homework ticks. Accounts see the child you allow them (<b>Accounts → Limits</b>); a switcher appears in the app when somebody may see more than one.</p>

 <td style="text-align:right;white-space:nowrap"><button class="b" onclick="kidKey('${esc(p.id)}')">WebUntis key</button><button class="b" onclick="kidRename('${esc(p.id)}')">Rename</button>${p.id!=="main"?`<button class="b d" onclick="kidRemove('${esc(p.id)}')">Remove</button>`:""}</td></tr>`).join("")}</table></div>

 <button class="b p" onclick="kidAdd()">Add</button></div><p class="sub">Then open <b>WebUntis</b> to enter that child's key. The wall-display (Parent) link shows the first child only.</p></div>`,
Notifications:async()=>{const [m,h]=[await api("/api/admin/mail"),C.health];const M=C.mail,kinds={timetable:"Timetable changes (cancelled, room, substitute)",homework:"New homework",exam:"New exams",grade:"New grades"};
 return `<h1>Notifications</h1><p class="sub">The server can e-mail what changes at school, a daily summary, and warnings about the machine itself.</p>
 <h2>E-mail</h2><div class="card"><div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("me",M.enabled)} Send e-mails</label></div>
 <div class="row"><div><label>Mail server (SMTP)</label><input id="mh" value="${esc(M.host)}" placeholder="smtp.example.com" size="26"></div><div><label>Port</label><input id="mp" type="number" value="${M.port}" style="width:90px"></div>
 <div><label>Security</label><select id="ms"><option value="starttls" ${M.security==="starttls"?"selected":""}>STARTTLS (port 587)</option><option value="ssl" ${M.security==="ssl"?"selected":""}>SSL/TLS (port 465)</option><option value="none" ${M.security==="none"?"selected":""}>None (not recommended)</option></select></div></div>
 <div class="row"><div><label>User name (blank = none)</label><input id="mu" value="${esc(M.user)}" autocomplete="off"></div><div><label>Password ${m.password_set?"(stored)":"(not set)"}</label><input id="mw" type="password" autocomplete="new-password" placeholder="${m.password_set?"leave empty to keep":"password"}"></div></div>
 <div class="row"><div><label>Sender address</label><input id="mf" value="${esc(M.sender)}" placeholder="ssc@example.com" size="26"></div><div><label>Send to (comma separated)</label><input id="mt" value="${esc(M.to.join(", "))}" placeholder="parent@example.com" size="34"></div></div>
 <div class="row">${Object.keys(kinds).map(k=>`<label style="display:inline-flex;gap:6px;align-items:center;color:var(--text)"><input type="checkbox" class="mk" value="${k}" ${M.kinds.includes(k)?"checked":""}> ${kinds[k]}</label>`).join("")}</div>
 <div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("md",M.digest)} Daily summary (tomorrow's lessons, homework due, exams) at</label><input id="mdt" type="time" value="${esc(M.digest_time)}">
 <label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("ma",M.alerts)} E-mail me when the server needs attention</label></div>
 <div class="row"><button class="b p" onclick="saveMail()">Save</button><button class="b" onclick="mailTest()">Send a test e-mail</button></div>
 <p class="sub">The mail password is stored on this server in a file only the service account can read (it has to be readable to log in to your mail provider) - use an app password, not your main one. The mail server's certificate is always checked. WebUntis messages are never sent. Mails go to the addresses above only.</p></div>
 <h2>Health warnings</h2><div class="card"><div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("he",h.enabled)} Watch disk, temperature, battery, services and disk health</label></div>
 <div class="row"><div><label>Disk filling up at (%)</label><input id="hw" type="number" value="${h.disk_warn}" style="width:90px"></div><div><label>Disk full at (%)</label><input id="hc" type="number" value="${h.disk_crit}" style="width:90px"></div>
 <div><label>Too hot at (°C)</label><input id="ht" type="number" value="${h.temp_warn}" style="width:90px"></div><div><label>Battery low at (%)</label><input id="hb" type="number" value="${h.battery_warn}" style="width:90px"></div><button class="b p" onclick="saveHealth()">Save</button></div></div>`},
Activity:async()=>{const l=await api("/api/admin/audit");return `<h1>Activity</h1><p class="sub">Sign-ins and changes (newest first).</p><div class="card"><table><tr><th>When</th><th>Who</th><th>What</th><th>From</th></tr>${l.map(e=>`<tr><td>${when(e.at)}</td><td>${esc(e.who)}</td><td>${esc(e.event)} ${esc(e.detail)}</td><td>${esc(e.ip)}</td></tr>`).join("")}</table></div>`}};
const alertsCard=H=>!H.enabled?"":H.alerts.length?`<div class="card" style="border-color:var(--warn)"><b>Needs attention</b>${H.alerts.map(a=>`<div class="kv"><span>${a.level==="crit"?"⛔":"⚠️"}</span><b style="font-weight:500;text-align:right">${esc(a.text)}</b></div>`).join("")}</div>`:`<div class="card"><b>✅ Everything looks fine</b> <span class="sub">disk, memory, temperature, services, disks</span></div>`;

let LIM=null;

 const d=a.expires?new Date(a.expires*1000).toISOString().slice(0,10):"";
 return `<h2>Limits for ${esc(a.name)}</h2><div class="card"><div class="row"><div><label>Account works until (blank = no end date)</label><input id="lxd" type="date" value="${d}"></div></div>
 <label>Sections it may see (none ticked = what its role sees)</label><div class="row">${secs.map(s=>`<label style="display:inline-flex;gap:6px;align-items:center;color:var(--text)"><input type="checkbox" class="lxs" value="${s}" ${a.sections.includes(s)?"checked":""}> ${s}</label>`).join("")}</div>
 ${S.profiles.length>1?`<label>Children it may see (none ticked = all)</label><div class="row">${S.profiles.map(p=>`<label style="display:inline-flex;gap:6px;align-items:center;color:var(--text)"><input type="checkbox" class="lxp" value="${esc(p.id)}" ${a.profiles.includes(p.id)?"checked":""}> ${esc(p.label)}</label>`).join("")}</div>`:""}

 try{await api("/api/admin/accounts/limits",{name:LIM,expires:$("#lxd").value,sections:v(".lxs"),profiles:document.querySelector(".lxp")?v(".lxp"):undefined});LIM=null;say("Saved");show("Accounts")}catch(e){say(e.message,false)}}

function saveMail(){const pw=$("#mw").value;cfg({mail:{enabled:$("#me").checked,host:$("#mh").value,port:+$("#mp").value,security:$("#ms").value,user:$("#mu").value,sender:$("#mf").value,to:$("#mt").value,
 kinds:[...document.querySelectorAll(".mk:checked")].map(i=>i.value),digest:$("#md").checked,digest_time:$("#mdt").value,alerts:$("#ma").checked}},"Saved");
 if(pw)api("/api/admin/mail/password",{password:pw}).then(()=>{$("#mw").value="";show("Notifications")}).catch(e=>say(e.message,false))}

function powerExtras(i){const w=i.waketest,V=w&&w.verdict?w.verdict:null,col={ok:"var(--ok)",running:"var(--muted)"}[V&&V[0]]||"var(--warn)";
 return `<h2>Wake-up test</h2><div class="card"><p class="sub" style="margin-top:0">Does this machine wake itself from sleep? The test puts it to sleep for 2 minutes and sees whether the hardware clock wakes it. The page becomes unreachable meanwhile. Nothing is changed for good. ${i.rtc?"":"<b>No hardware clock (RTC) was found - timed wake-up is not possible here.</b>"}${i.can_suspend?"":" <b>This machine can't suspend to memory.</b>"}</p>
 ${V?`<div class="kv"><span>Last test</span><b style="color:${col}">${esc(V[1])}</b></div>`:""}
 <div class="row"><button class="b p" ${i.rtc&&i.can_suspend?"":"disabled"} onclick="wakeTest()">Run the wake-up test</button></div></div>
 <h2>Power off and switch on again</h2><div class="card"><p class="sub" style="margin-top:0">Shut down now; the hardware clock switches the machine on again later. Only use this after the wake-up test worked. If it does not wake up, somebody has to press the power button.</p>
 <div class="row"><div><label>Switch on again at (local time)</label><input id="pw1" type="time" value="06:00"></div><button class="b d" ${i.rtc?"":"disabled"} onclick="powerWake('t')">Power off, on again at that time</button>
 <div><label>or after (minutes)</label><input id="pw2" type="number" min="1" value="60" style="width:100px"></div><button class="b d" ${i.rtc?"":"disabled"} onclick="powerWake('m')">Power off, on again after that</button></div></div>
 <h2>Wake-on-LAN</h2><div class="card"><div class="row"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--text)">${chk("wol",C.power.wol)} Let this machine be woken by a magic packet (wired network only)</label><button class="b p" onclick="cfg({power:{wol:$('#wol').checked}},'Saved - applying…')">Save</button></div>
 <p class="sub">To switch this machine on from your phone or router: send a Wake-on-LAN packet to ${i.wol.own.length?i.wol.own.map(m=>"<code>"+esc(m.mac)+"</code> ("+esc(m.interface)+")").join(", "):"its wired network card (none found)"}. It works from sleep or power-off only if the BIOS allows it; Wi-Fi almost never supports it. This web page cannot do it itself - when the machine is off, so is the page.</p>
 <h2 style="margin-top:14px">Machines this server can wake</h2>${i.wol.devices.length?`<table><tr><th>Name</th><th>MAC address</th><th></th></tr>${i.wol.devices.map(d=>`<tr><td>${esc(d.name)}</td><td><code>${esc(d.mac)}</code></td><td style="text-align:right"><button class="b" onclick="wolSend('${esc(d.name)}')">Wake</button><button class="b d" onclick="wolDel('${esc(d.name)}')">Remove</button></td></tr>`).join("")}</table>`:"<p class='sub'>None yet.</p>"}
 <div class="row"><input id="wn" placeholder="name" size="14"><input id="wm" placeholder="aa:bb:cc:dd:ee:ff" size="20"><button class="b p" onclick="wolAdd()">Add</button></div></div>`}
async function wakeTest(){if(!confirm("Put the server to sleep for 2 minutes now? This page is unreachable meanwhile. If the hardware clock can't wake it, you have to press the power button."))return;
 try{await api("/api/admin/waketest",{});say("Going to sleep in a few seconds - reload this page in about 3 minutes.")}catch(e){say(e.message,false)}}
async function powerWake(k){const wake=k==="t"?$("#pw1").value:$("#pw2").value;if(!wake)return say("Choose when it should switch on again.",false);
 if(!confirm("Power off the server now? The hardware clock should switch it on again ("+(k==="t"?"at "+wake:"after "+wake+" minutes")+"). If your machine doesn't support that, press its power button."))return;
 try{await api("/api/admin/power",{action:"poweroff_wake",wake});say("Requested - the server powers off in a few seconds.")}catch(e){say(e.message,false)}}
async function wolSend(n){try{const j=await api("/api/admin/wol",{name:n});say("Magic packet sent to "+j.device+" ("+j.sent+" broadcast(s)).")}catch(e){say(e.message,false)}}
async function wolAdd(){const d=[...C.wol.devices,{name:$("#wn").value,mac:$("#wm").value}];cfg({wol:{devices:d}},"Saved")}
async function wolDel(n){cfg({wol:{devices:C.wol.devices.filter(d=>d.name!==n)}},"Removed")}

function saveNet(){cfg({network:{hostname:$("#hn").value,mode:$("#nm").value,interface:$("#if").value,address:$("#ad")?$("#ad").value:"",gateway:$("#gw")?$("#gw").value:"",dns:($("#dn")?$("#dn").value:"")}},"Saved - applying…")}
function saveWifi(){run(()=>api("/api/admin/wifi",{enabled:$("#wfe").checked,ssid:$("#wfs").value,passphrase:$("#wfp").value,country:$("#wfc").value,open:$("#wfo").checked,hidden:$("#wfh").checked}),"Saved - connecting…")}
async function saveUntis(){const qr=$("#qr").value.trim();
  const body=qr?{qr,test:true,profile:kid()}:{server:$("#us").value,school:$("#uc").value,user:$("#uu").value,key:$("#uk").value,test:true,profile:kid()};

  try{const r=await api("/api/admin/untis",body);say(r.message||"Saved",r.tested!==false);$("#qr").value="";$("#uk").value="";setTimeout(()=>show("WebUntis"),2500)}catch(e){say(e.message,false)}}
async function chkUpd(){const el=$("#upd");el.textContent="Checking…";
  try{const r=await fetch("/api/update/check"),j=await r.json();
    if(!r.ok){el.textContent=j.error||"Could not check";return}
    if(!j.update_available){el.textContent="You're up to date.";return}
    if(j.channel==="commits"){const ci={passed:"tests passed",failed:"tests FAILED",pending:"tests still running",unknown:"no test result"}[j.ci]||"";
      el.innerHTML="A new version is available: <b>"+esc(j.notes||"new commit")+"</b> ("+esc(j.latest)+", "+esc(ci)+"). <a href='"+esc(j.url)+"' target='_blank' rel='noopener'>See the change</a> "+(j.ci==="failed"?"":"<button class='b p' onclick='instUpd()'>Install update</button>");return}
    el.innerHTML="Version "+esc(j.latest)+" is available. <a href='"+esc(j.url)+"' target='_blank' rel='noopener'>Release notes</a> <button class='b p' onclick='instUpd()'>Install update</button>"}
  catch(e){el.textContent="Could not check for updates"}}
async function instUpd(){if(!confirm("Download and install the new version now? The web service restarts."))return;
  const el=$("#upd");try{const r=await fetch("/api/update/install",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}),j=await r.json();
    if(!r.ok){el.textContent=j.error||"failed";return}el.textContent="Updating - this page reloads when the server is back…";
    const cur=j.from,cc=j.from_commit||"",t=setInterval(async()=>{try{const h=await (await fetch("/health")).json();if(h.version&&(h.version!==cur||(h.commit||"")!==cc)){clearInterval(t);location.reload()}}catch(e){}},3000)}
  catch(e){el.textContent="failed"}}
function saveSched(){const days=["mon","tue","wed","thu","fri","sat","sun"].filter(d=>$("#scd-"+d).checked);
  cfg({schedule:{enabled:$("#sce").checked,off:$("#sco").value,on:$("#scn").value,mode:$("#scm").value,days,spin_down_disks:$("#scdk").checked,screen_off:$("#scsc").checked,stop_ssh:$("#scss").checked}},"Saved - applying…")}
async function powerAct(a){if(!confirm(a==="reboot"?"Restart the server now? It is unreachable for about a minute.":"Power off the server now? You will have to switch it on by hand."))return;
  try{await api("/api/admin/power",{action:a});say("Requested - the server "+(a==="reboot"?"restarts":"powers off")+" in a few seconds…");if(a==="reboot")waitBack()}catch(e){say(e.message,false)}}
function waitBack(){let down=false;const t=setInterval(async()=>{try{const r=await fetch("/health",{cache:"no-store"});if(r.ok&&down){clearInterval(t);location.reload()}}catch(e){down=true}},3000)}
async function svcRestart(n){if(!confirm("Restart "+n+"?"))return;try{await api("/api/admin/service",{name:n,action:"restart"});say("Restart requested for "+n+".");if(n==="ssc-server")waitBack()}catch(e){say(e.message,false)}}
async function signOutAll(n){try{const j=await api("/api/admin/accounts/signout",{name:n});say(j.closed+" session(s) of "+n+" closed.");show("System")}catch(e){say(e.message,false)}}
async function showLog(){const b=$("#logbox");b.textContent="Loading…";try{const j=await api("/api/admin/logs?unit="+$("#lg").value+"&n="+$("#ln").value);b.textContent=j.text;b.scrollTop=b.scrollHeight}catch(e){b.textContent=e.message}}
async function downloadBackup(){try{const j=await api("/api/admin/backup"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(j,null,2)],{type:"application/json"}));
  a.download="ssc-settings-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href)}catch(e){say(e.message,false)}}
async function restoreBackup(f){if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){return say("That file is not valid JSON.",false)}
  if(!j.settings||!j.ssc_backup)return say("That is not an SSC settings backup.",false);if(!confirm("Restore the settings from this backup? Network and SSH changes are applied right away."))return;
  try{await api("/api/admin/restore",{settings:j.settings});say("Settings restored - applying…");setTimeout(()=>show("System"),1500)}catch(e){say(e.message,false)}}
function savePower(){cfg({power:{lid:$("#pl").value,block_sleep:$("#pb").checked}},"Saved - applying…")}
function saveAuto(){cfg({console:{autologin_user:$("#ale").checked?$("#alu").value.trim():""}},"Saved - applies at the next boot")}
function saveWeb(){cfg({web:{port:+$("#wp").value,bind:$("#wb").value,session_hours:+$("#sh").value,https:$("#hs").checked},firewall:{enabled:$("#fw").checked}},"Saved - the service restarts. If you changed HTTPS, open the address again with "+($("#hs").checked?"https://":"http://")+" in front.")}
function saveLinks(){cfg({links:{enabled:$("#le").checked,long:$("#ll").checked,port:+$("#lp").value,expire_days:+$("#lx").value}},"Saved")}
function saveSsh(){cfg({ssh:{enabled:$("#se").checked,port:+$("#sp").value,permit_root:$("#sr").checked,password_auth:$("#spw").checked,allow_users:$("#su").value}},"Saved - applying…")}
show("Overview").catch(()=>{});
</script></body></html>
