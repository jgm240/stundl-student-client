var exact = {}, patterns = [];

function addRows(rows) {
  rows.forEach(function (r) {
    var key = r[0];
    ORDER.forEach(function (lang, i) { if (r[i + 1]) (exact[lang] = exact[lang] || {})[key] = r[i + 1]; });
    if (key.indexOf("{") >= 0) {
      var names = [];
      var re = "^" + key.replace(/[.*+?^$()|[\]\\]/g, "\\$&").replace(/\{(\w+)\}/g, function (_, n) { names.push(n); return "(.+?)"; }) + "$";
      patterns.push({ key: key, re: new RegExp(re), names: names, weight: key.replace(/\{\w+\}/g, "").length });
    }
  });
  patterns.sort(function (a, b) { return b.weight - a.weight; });      // the most specific wording wins
}
addRows(D);

var lang = "en";

function tpl(str, vars) {
  return vars ? String(str).replace(/\{(\w+)\}/g, function (m, n) { return vars[n] != null ? vars[n] : m; }) : str;
}

/* T("due in {n} days ({d})", {n: 3, d: "11-24"})  -> translated text with the values filled in */
function T(key, vars) {
  var s = (exact[lang] && exact[lang][key]) || key;
  return tpl(s, vars);
}

/* tr(text): translate a finished text (as it appears on the page), keeping surrounding white space */
function tr(text) {
  if (lang === "en" || !text) return text;
  var m = /^(\s*)([\s\S]*?)(\s*)$/.exec(text), core = m[2];
  if (!core) return text;
  var table = exact[lang];
  if (!table) return text;
  if (table[core] !== undefined) return m[1] + table[core] + m[3];
  for (var i = 0; i < patterns.length; i++) {
    var p = patterns[i], mm = p.re.exec(core);
    if (mm && table[p.key]) {
      var vars = {};
      p.names.forEach(function (n, j) { vars[n] = mm[j + 1]; });
      return m[1] + tpl(table[p.key], vars) + m[3];
    }
  }
  return text;
}

const HO={missed:0,soon:1,pending:2},hwRows=(n)=>(D.homework||[]).filter(h=>h.status!=="done").sort((a,b)=>(HO[a.status]??3)-(HO[b.status]??3)||(a.due<b.due?-1:1)).slice(0,n);

const exRows=n=>{const t=iso(new Date());return (D.exams||[]).filter(e=>!e.date||e.date>=t).slice(0,n)};

const planFrom=(n)=>{const t=iso(new Date());return (D.plan||[]).filter(p=>p.date>=t&&!(p.done&&p.date>t)).slice(0,n)};
const chRow=c=>`<div class="row"><span><span class="badge ${esc(c.kind)}">${esc(c.kind)}</span>${esc(c.text)}</span></div>`;
function wall(){
  const now=new Date(),t=iso(now),nm=now.getHours()*60+now.getMinutes(),tm=iso(new Date(Date.now()+864e5));
  const es=has("timetable")||has("today")?all().filter(e=>e.date===t):[],cur=es.find(e=>mins(e.start)<=nm&&nm<mins(e.end)&&!e.cancelled),nxt=es.find(e=>mins(e.start)>nm&&!e.cancelled);
  const tmr=all().filter(e=>e.date===tm&&!e.cancelled),ch=(D.changes||[]).slice(0,4);
  const big=cur?`<div class="mut" style="font-size:2.2vmin">NOW</div><div class="now">${esc(cur.subject_long||cur.subject)}<small>${hm(cur.start)}–${hm(cur.end)} · ${esc(cur.room)} ${esc(cur.teacher_long||cur.teacher)}</small>${cur.topic?`<small>${esc(cur.topic)}</small>`:""}</div>`:
    nxt?`<div class="mut" style="font-size:2.2vmin">NEXT</div><div class="now">${esc(nxt.subject)}<small>${hm(nxt.start)} · ${esc(nxt.room)} ${esc(nxt.teacher)}</small></div>`:

   <div class="card" style="grid-row:2/4"><h2>Today</h2>${es.map(lessonRow).join("")||`<div class="mut wall-sm">No lessons.</div>`}</div>
   <div class="card"><h2>Homework due</h2>${hwRows(4).map(hwRow).join("")||`<div class="mut wall-sm">Nothing open 🎉</div>`}${exRows(2).length?`<h2 style="margin-top:1.4vmin">Exams</h2>`+exRows(2).map(exRow).join(""):""}</div>
   <div class="card">${has("plan")?`<h2>Study plan</h2>${planFrom(3).map(planRow).join("")||`<div class="mut wall-sm">Nothing planned.</div>`}<h2 style="margin-top:1.4vmin">Changes</h2>${ch.slice(0,2).map(chRow).join("")||`<div class="mut wall-sm">No recent changes.</div>`}`:
   `<h2>Changes</h2>${ch.map(chRow).join("")||`<div class="mut wall-sm">No recent changes.</div>`}`}</div>`}
function today(){const t=iso(new Date()),tm=iso(new Date(Date.now()+864e5)),es=all();
  const day=(d)=>`<div class="card" style="margin-bottom:10px"><h2>${dayName(d)}</h2>${es.filter(e=>e.date===d).map(lessonRow).join("")||`<div class="mut">No lessons.</div>`}</div>`;
  return day(t)+day(tm)+`<div class="card" style="margin-bottom:10px"><h2>Homework due soon</h2>${hwRows(6).map(hwRow).join("")||`<div class="mut">Nothing open.</div>`}</div>`+
   (has("plan")&&planFrom(1).length?`<div class="card" style="margin-bottom:10px"><h2>Study plan</h2>${planFrom(6).map(planRow).join("")}</div>`:"")+
   ((D.changes||[]).length?`<div class="card"><h2>Latest changes</h2>${D.changes.slice(0,5).map(chRow).join("")}</div>`:"")}
function timetable(){const ws=Object.keys(D.timetable||{}).sort();if(!ws.length)return `<p class="mut">No timetable data yet.</p>`;
  if(!ws.includes(wk)){const t=iso(new Date());wk=[...ws].reverse().find(w=>w<=t)||ws[0]}

  return `<p><button onclick="shift(-1)">←</button> <b>Week of ${wk}</b> <button onclick="shift(1)">→</button></p><div class="week">`+Object.keys(days).sort().map(d=>`<div><h2>${dayName(d)}</h2>${days[d].map(e=>`<div class="ent ${e.cancelled?"x":""}"><b>${esc(e.subject)}</b> ${esc(e.room)}<small>${hm(e.start)}–${hm(e.end)} · ${esc(e.teacher)}${e.cancelled?" · CANCELLED":""}</small>${e.topic?`<small>${esc(e.topic)}</small>`:(e.info?`<small>${esc(e.info)}</small>`:"")}</div>`).join("")}</div>`).join("")+`</div>`}
function shift(n){const ws=Object.keys(D.timetable).sort(),i=ws.indexOf(wk)+n;if(ws[i]){wk=ws[i];render()}}
const list=(a,f,empty)=>`<div class="card">${(a||[]).map(f).join("")||`<div class="mut">${empty}</div>`}</div>`;
const views={today,timetable,
  homework:()=>list(D.homework,h=>`<div class="row"><span class="t">${esc(dShort(h.due))}</span><span>${subjChip(h.subject)} ${esc(h.text)}${h.done?` <span class="mut">(done)</span>`:""}</span></div>`,"No homework."),

    return `<div class="card"><h2>Upcoming</h2>${up.map(planRow).join("")||`<div class="mut">Nothing planned.</div>`}</div>`+(old.length?`<div class="card" style="margin-top:10px"><h2>Last 7 days</h2>${old.map(planRow).join("")}</div>`:"")},changes:()=>list(D.changes,chRow,"No changes."),
  grades:()=>`<div class="card">${(D.grades||[]).length?`<table><tr><th>Subject<th>Average<th>Marks</tr>${D.grades.map(g=>`<tr><td>${esc(g.subject)}<td>${g.average??"–"}<td>${esc(g.marks.join(", "))}`).join("")}</table>`:`<div class="mut">No grades.</div>`}</div>`,
  absences:()=>{const a=D.absences||{limits:[],list:[]};return `<div class="card"><p>${a.total||0} absences · ${a.excused||0} excused · ${a.open||0} open · ${a.days||0} days</p>${(a.limits||[]).length?`<table><tr><th>Subject<th>Missed<th>Status</tr>${a.limits.map(x=>`<tr><td>${esc(x.subject)}<td>${x.missed}/${x.total} (${Math.round(x.pct*100)}%)<td>${esc(x.level)}`).join("")}</table>`:""}${(a.list||[]).map(x=>`<div class="row"><span class="t">${esc(x.start.slice(5))}</span><span>${x.excused?"excused":"open"} ${esc(x.reason)}</span></div>`).join("")}</div>`}};
function render(){
  if(!D)return;

</script><script>
