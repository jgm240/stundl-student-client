# Tests on Windows, Linux and macOS, and builds the Windows and Linux downloads.
# Tests run on every push; builds run from the Actions tab ("Run workflow").
name: Desktop tests and builds
on:
  push:
    paths: ["*.py", "*.html", "tests/**", "custom_components/**", "requirements.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pillow segno
      - run: python -m unittest discover -s tests -v
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt/X libraries for the Linux window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python build.py
      - name: Smoke test the built program
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then P="dist/ssc-cli/ssc-cli.exe"; else P="dist/ssc/ssc"; fi
          SSC_DATA_DIR="$RUNNER_TEMP/ssc-data" "$P" -h | head -5
          SSC_DATA_DIR="$RUNNER_TEMP/ssc-data" "$P" plan add "smoke test" --minutes 5
          SSC_DATA_DIR="$RUNNER_TEMP/ssc-data" "$P" stats
      - uses: actions/upload-artifact@v4
        with:
          name: SSC-${{ runner.os }}
          path: dist/SSC-*.*
