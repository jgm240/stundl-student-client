<title>Stundl Student Client</title>
<meta name="color-scheme" content="light dark">

<style>
:root{
  color-scheme:light;
  --bg:#f3f5fb;--surface:#ffffff;--surface2:#eef1f8;--text:#131826;--muted:#667085;--line:#e3e7f0;
  --accent:#4f46e5;--accent2:#0ea5a4;--accent-soft:rgba(79,70,229,.11);--on-accent:#fff;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;--side:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 22px rgba(16,24,40,.06);--radius:16px;
  --acc:var(--accent);--mut:var(--muted);--fg:var(--text);--glass:var(--surface);--glass2:var(--surface2);--edge:var(--line);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0b0f17;--surface:#141a26;--surface2:#1b2332;--text:#eef1f8;--muted:#98a3b7;--line:#252f43;
  --accent:#8e90ff;--accent2:#2dd4bf;--accent-soft:rgba(142,144,255,.16);--on-accent:#0b0f17;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--side:#0f1420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0f17;--surface:#141a26;--surface2:#1b2332;--text:#eef1f8;--muted:#98a3b7;--line:#252f43;
  --accent:#8e90ff;--accent2:#2dd4bf;--accent-soft:rgba(142,144,255,.16);--on-accent:#0b0f17;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--side:#0f1420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
body.native{background:transparent}
body.native #content{background:color-mix(in srgb,var(--bg) 80%,transparent)}
body.native #side{background:color-mix(in srgb,var(--side) 60%,transparent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mut{color:var(--muted)}.sp{margin-left:auto}
small{color:var(--muted)}
b{font-weight:650}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 14px;background:var(--side);border-right:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 6px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 4px 12px rgba(59,63,216,.3)}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.15}
.brand small{font-size:12px}
#tabs{display:flex;flex-direction:column;gap:2px;margin-top:14px;overflow-y:auto;flex:1}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 12px 6px;font-weight:700}
#tabs button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:12px;background:transparent;border:0;color:var(--text);font:inherit;font-size:14.5px;text-align:left;cursor:pointer;transition:background .15s}
#tabs button:hover{background:var(--surface2)}
#tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
#tabs svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.count{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
.side-foot{padding:10px 10px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:8px}
#content{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px)}
#top h1{margin:0;font-size:26px;letter-spacing:-.025em;font-weight:750}
#theme{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:11px}
#theme svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sync.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#banner{display:none;margin:0 28px;padding:10px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:13.5px}
main{padding:6px 28px 70px;width:100%;max-width:1240px}
body.setup #side{display:none}body.setup #app{display:block}body.setup #top{display:none}body.setup main{margin:0 auto;max-width:760px;padding-top:40px}

/* ---------- controls ---------- */
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,transform .05s}
button:hover{background:var(--surface2)}button:active{transform:scale(.98)}
button.on,button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
button.on:hover,button.primary:hover{filter:brightness(1.08);background:var(--accent)}
select,input[type=search],input[type=text],input[type=date],input[type=time],input[type=number],textarea{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.bar{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
label{display:inline-flex;gap:8px;align-items:center}

/* ---------- content blocks ---------- */
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:28px 2px 10px;font-weight:750}
h2:first-child{margin-top:8px}
h3{margin:0;font-size:17px}
p{margin:6px 0}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .b{flex:1;min-width:0}
.item.done{opacity:.55}
.item.new{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item small{display:block}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:99px;background:var(--accent);color:#fff;margin-right:6px;vertical-align:1px}
.badge.grade{background:var(--ok)}.badge.homework{background:var(--warn)}.badge.timetable{background:var(--bad)}.badge.exam{background:var(--info)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
td,th{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
pre{white-space:pre-wrap;padding:12px;border-radius:12px;font-size:12px;background:var(--surface2)}

/* ---------- timetable ---------- */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.day{min-width:0}
.day h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px 2px}
.day.today h3{color:var(--accent)}
.day.today{padding:8px;margin:-8px;border-radius:16px;background:var(--accent-soft)}
.ent{--h:230;position:relative;border-radius:12px;padding:9px 12px 9px 15px;margin-bottom:8px;background:color-mix(in srgb,hsl(var(--h) 70% 52%) 11%,var(--surface));border:1px solid color-mix(in srgb,hsl(var(--h) 60% 50%) 24%,var(--line));overflow:hidden}
.ent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:hsl(var(--h) 65% 52%)}
.ent b{font-size:15px}
.ent small{display:block}
.ent.x{opacity:.7;background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.ent.x::before{background:var(--bad)}.ent.x b{text-decoration:line-through}
@media(max-width:1100px){.week{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.week{grid-template-columns:1fr}}

/* ---------- Today dashboard ---------- */
.hero-card{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;padding:24px 26px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--accent2,#0ea5a4) 0%,var(--accent) 100%);box-shadow:0 14px 34px var(--accent-soft);margin-bottom:18px}
.hero-card small{color:rgba(255,255,255,.8)}
.hero-card .hello h3{font-size:26px;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.hero-card .nowbox{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:14px 18px;backdrop-filter:blur(6px)}
.hero-card .nowbox b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:2px 0 4px}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:#fff;border-radius:99px}
@media(max-width:760px){.hero-card{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:6px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}
.tile:hover{background:var(--surface)}
.tile small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.tile b{font-size:28px;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile.warn b{color:var(--bad)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 22px}
@media(max-width:1000px){.dash{grid-template-columns:1fr}}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.lrow .t{width:84px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;flex:none}
.lrow .dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h,230) 65% 52%);flex:none}
.lrow.x{opacity:.65}.lrow.x b{text-decoration:line-through}
.lrow.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lrow .r{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}

/* ---------- mobile: bottom tab bar ---------- */
@media(max-width:900px){
  #app{display:block}
  #side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--side) 92%,transparent);backdrop-filter:blur(16px)}
  .brand,.side-foot,.nav-h{display:none}
  #tabs{flex-direction:row;margin:0;gap:2px;overflow-x:auto;overflow-y:hidden;width:100%;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 10px;min-width:68px;justify-content:center;text-align:center;position:relative}
  #tabs button .lbl{white-space:nowrap}
  .count{position:absolute;top:2px;right:12px;margin:0}
  #top{padding:12px 16px}#top h1{font-size:22px}
  main{padding:4px 16px 100px}#banner{margin:0 16px}
}
/* ---------- lesson detail drawer ---------- */
.ent,.lrow{cursor:pointer}
.ent:hover{filter:brightness(1.03);box-shadow:var(--shadow)}.lrow:hover{background:var(--surface2)}
.topic{display:block;margin-top:3px;color:var(--text);opacity:.82;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.drawer-bg{position:fixed;inset:0;z-index:60;background:rgba(5,8,16,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .18s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);overflow:auto;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);padding:22px 22px 40px;transform:translateX(30px);transition:transform .2s}
.drawer-bg.open .drawer{transform:none}
.drawer .x{position:absolute;top:14px;right:14px;width:34px;height:34px;padding:0;border-radius:10px}
.d-head{display:flex;gap:12px;align-items:flex-start;padding-right:40px}
.d-dot{width:14px;height:14px;border-radius:50%;margin-top:9px;flex:none;background:hsl(var(--h,230) 65% 52%)}
.d-head h3{font-size:24px;letter-spacing:-.02em;line-height:1.15}
.d-head small{display:block;margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:600}
.d-sec{margin-top:22px}
.d-sec h2{margin:0 0 8px}
.d-box{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14.5px;white-space:pre-wrap}
.drawer .item>button{display:none}
.d-box small{display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700}
@media(max-width:900px){.drawer{top:auto;left:0;width:auto;max-height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(40px)}}

/* ---------- subjects, exam dates, polish ---------- */
.subj{--h:230;display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;line-height:1.3;padding:3px 11px 3px 9px;border-radius:99px;color:var(--text);
  background:color-mix(in srgb,hsl(var(--h) 70% 52%) 16%,var(--surface));border:1px solid color-mix(in srgb,hsl(var(--h) 65% 50%) 32%,var(--line))}
.subj::before{content:"";width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 65% 52%)}
.subj.none{--h:220;font-weight:600;color:var(--muted);background:var(--surface2);border-style:dashed}
.hw-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.hw-top .badge{margin:0}.hw-top small.due{display:inline;font-size:13px}
.hw-text{font-size:15px;line-height:1.45}
h2.gh{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px}
.datebox{flex:none;width:58px;padding:7px 4px 8px;border-radius:14px;text-align:center;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;line-height:1.1;gap:1px}
.datebox b{font-size:25px;letter-spacing:-.02em;font-weight:750}.datebox small,.datebox span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:inherit;opacity:.85}
.datebox.today{background:var(--accent);color:var(--on-accent)}
.item.exam{align-items:center}.item.exam.done .datebox{background:var(--surface2);color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,.tile:focus-visible,.ent:focus-visible,.lrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item{transition:box-shadow .15s,transform .15s}.item:hover{box-shadow:0 2px 4px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.09)}
.tile{transition:transform .12s,box-shadow .15s}.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 14px 30px rgba(16,24,40,.1)}
#main>p.mut:only-child{padding:42px 16px;text-align:center;font-size:15px}
.bar .sp{flex:1}
.dash .item.hw>button,.dash .item.hw .hw-top .badge{display:none}.dash .item.hw{padding:11px 14px}
/* ---------- phones: nothing may be wider than the screen, controls are easy to hit, and iOS Safari must not zoom in on a field ---------- */
@media(max-width:900px){
  html,body{max-width:100%;overflow-x:hidden}
  #top{flex-wrap:wrap;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  #top h1{flex:1 1 100%;min-width:0;margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #top .sp{display:none}
  #exp{flex:1 1 0;min-width:0;max-width:none}
  #sync{white-space:nowrap}
  #banner{margin:0 14px}
  main{padding:4px 14px calc(104px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
  #side{padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right))}
  select,input[type=search],input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],textarea{font-size:16px;min-height:42px;max-width:100%}
  button{min-height:40px}
  #tabs button{min-height:0}
  main .bar>*,main .row>*,.item>*,.lrow>*,.kv>*,.hw-top>*{min-width:0}
  main .row,.kv{flex-wrap:wrap}
  .bar select,.bar input[type=search],.bar input[type=text]{flex:1 1 150px}
  table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .subj{max-width:100%}
  .item.hw{flex-wrap:wrap;row-gap:8px}                 /* the text gets the whole width; the buttons go below it */
  .item.hw>.b{flex:1 1 calc(100% - 42px)}
  .item.hw>button{margin-left:32px}.item.hw>button+button{margin-left:0}
  .dash .item.hw>.b{flex-basis:0}
  .hero-card{padding:20px 18px;gap:14px}.hero-card .hello h3{font-size:23px}.hero-card .nowbox b{font-size:26px}
  .tiles{grid-template-columns:1fr 1fr}.tile{padding:12px 14px}.tile b{font-size:24px}
  .lrow{flex-wrap:wrap;row-gap:4px}.lrow .t{width:auto;min-width:78px}
  .drawer{padding:20px 18px calc(36px + env(safe-area-inset-bottom))}
}
@media(max-width:380px){.tiles{grid-template-columns:1fr}#top h1{font-size:20px}}
</style></head><body>

<script>
if(location.search.includes("native"))document.body.classList.add("native");

const ICONS={
 today:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',

 ex:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3.5"/>',

 gr:'<path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/>',

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),dayName=s=>new Date(s+"T12:00").toLocaleDateString(SSCUI.locale(),{weekday:"short",day:"numeric",month:"short"});

const post=(u,b)=>SNAP?Promise.resolve():fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});

const hue=t=>{let h=0;for(const c of String(t||"?"))h=(h*31+c.charCodeAt(0))%360;return h};
const lkey=e=>esc(e.date+"|"+e.start+"|"+e.subject);
const chip=e=>(e.changes&&e.changes.length)?`<span class="chip">changed</span>`:"";
const ent=e=>`<div class="ent ${e.cancelled?"x":""}" style="--h:${hue(e.subject)}" onclick="lesson('${lkey(e)}')" role="button" tabindex="0"><b>${esc(e.subject||"Lesson")}</b>${chip(e)} <span class="mut">${esc(e.room)}</span><small>${e.start.slice(11,16)}–${e.end.slice(11,16)} · ${esc(e.teacher)}${e.cancelled?" · "+SSCUI.t("CANCELLED"):""}</small>${e.topic?`<span class="topic" translate="no">${esc(e.topic)}</span>`:(e.info?`<small>${esc(e.info)}</small>`:"")}</div>`;
const allEntries=()=>Object.values(S.timetable||{}).flat();
const pad2=n=>String(n).padStart(2,"0"),hmOf=e=>e.start.slice(11,16)+"–"+e.end.slice(11,16);
function nowNext(){const n=new Date(),now=iso(n)+"T"+pad2(n.getHours())+":"+pad2(n.getMinutes()),es=allEntries().filter(e=>!e.cancelled).sort((a,b)=>a.start<b.start?-1:1);
  return{now,cur:es.find(e=>e.start<=now&&now<e.end),nxt:es.find(e=>e.start>now)}}
function lessonRows(d,now){const l=allEntries().filter(e=>e.date===d).sort((a,b)=>a.start<b.start?-1:1);
  return l.map(e=>`<div class="lrow ${e.cancelled?"x":""} ${now&&!e.cancelled&&e.start<=now&&now<e.end?"now":""}" style="--h:${hue(e.subject)}" onclick="lesson('${lkey(e)}')" role="button" tabindex="0"><span class="dot"></span><span class="t">${hmOf(e)}</span><div style="min-width:0"><b>${esc(e.subject_long||e.subject||"Lesson")}</b>${e.cancelled?` <small style="display:inline;color:var(--bad)">cancelled</small>`:""}${chip(e)}${e.topic?`<span class="topic" translate="no">${esc(e.topic)}</span>`:""}</div><span class="r">${esc(e.room)} ${esc(e.teacher)}${!e.topic&&e.info?"<br>"+esc(e.info):""}</span></div>`).join("")||`<p class="mut">No lessons.</p>`}
function lessonBody(e){
  const t=iso(new Date()),subj=e.subject,d=new Date(e.start),mins=Math.round((new Date(e.end)-d)/60000);
  const changed=(e.changes&&e.changes.length)||/CHANGED|SUBST/i.test(e.status||"");
  const badge=e.cancelled?`<span class="badge" style="background:var(--bad)">Cancelled</span>`:changed?`<span class="badge" style="background:var(--warn)">Changed</span>`:`<span class="badge" style="background:var(--ok)">Regular</span>`;
  const kv=(k,v)=>v?`<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`:"";
  const box=(k,v)=>v?`<div class="d-box"><small>${k}</small><span translate="no">${esc(v)}</span></div>`:"";
  const same=allEntries().filter(x=>x.subject===subj&&x.start>e.start&&!x.cancelled).sort((a,b)=>a.start<b.start?-1:1).slice(0,3);
  const hw=S.homework.filter(h=>!h.dismissed&&h.status!=="done"&&h.subject===subj),ex=(S.exams||[]).filter(x=>x.subject===subj&&x.date>=t),pl=(S.plan||[]).filter(p=>p.subject===subj&&p.date>=t&&!p.done);
  const content=[box("Lesson topic",e.topic),box("Notes",e.note),box("Substitution",e.substitution),(e.info&&e.info!==e.substitution&&e.info!==e.note&&e.info!==e.topic)?box("Info",e.info):""].join("");
  return `<div class="d-head" style="--h:${hue(subj)}"><span class="d-dot"></span><div><h3>${esc(e.subject_long||subj||"Lesson")}</h3><small>${badge} ${esc(d.toLocaleDateString(SSCUI.locale(),{weekday:"long",day:"numeric",month:"long"}))}</small></div></div>
  <div class="d-sec">${kv("Time",e.start.slice(11,16)+"–"+e.end.slice(11,16)+(mins>0?" ("+mins+" min)":""))}${kv("Teacher",e.teacher_long||e.teacher)}${kv("Room",e.room_long&&e.room_long!==e.room?e.room_long+" ("+e.room+")":e.room)}${kv("Class / group",e.group)}${kv("Type",(e.kind||"").replace(/_/g," ").toLowerCase().replace(/^./,c=>c.toUpperCase()))}</div>
  ${(e.changes&&e.changes.length)?`<div class="d-sec"><h2>What changed</h2>${e.changes.map(c=>`<div class="d-box">${esc(c)}</div>`).join("")}</div>`:""}
  <div class="d-sec"><h2>Lesson content</h2>${content||`<p class="mut">Nothing entered for this lesson yet. WebUntis only shows content when the teacher has filled it in.</p>`}</div>
  ${hw.length||ex.length||pl.length?`<div class="d-sec"><h2>Related · ${esc(subj)}</h2>${hw.map(hwItem).join("")}${ex.map(examItem).join("")}${pl.map(planItem).join("")}</div>`:""}
  ${same.length?`<div class="d-sec"><h2>Next ${esc(subj)} lessons</h2>${same.map(x=>`<div class="kv"><span>${esc(dayName(x.date))}</span><b>${x.start.slice(11,16)}–${x.end.slice(11,16)}${x.room?" · "+esc(x.room):""}</b></div>`).join("")}</div>`:""}
  ${SNAP?"":`<div class="d-sec"><button class="primary" onclick="closeLesson();pnew({title:'Prepare ${esc(subj).replace(/'/g,"")}',subject:'${esc(subj).replace(/'/g,"")}',date:'${e.date}'})">+ Add to study plan</button></div>`}`}
function lesson(key){const e=allEntries().find(x=>x.date+"|"+x.start+"|"+x.subject===key);if(!e)return;
  $("#dbody").innerHTML=lessonBody(e);const d=$("#drawer");d.classList.add("open");d.setAttribute("aria-hidden","false");$("#drawer .drawer").scrollTop=0}
function closeLesson(){const d=$("#drawer");d.classList.remove("open");d.setAttribute("aria-hidden","true")}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeLesson();if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&(ev.target.classList.contains("ent")||ev.target.classList.contains("lrow"))){ev.preventDefault();ev.target.click()}});
function today(){
  const n=new Date(),t=iso(n),tm=iso(new Date(Date.now()+864e5)),{now,cur,nxt}=nowNext(),e=cur||nxt;
  const sm=S.homework_summary||{},ord={missed:0,soon:1,pending:2};
  const hw=S.homework.filter(h=>!h.dismissed&&h.status!=="done").sort((a,b)=>ord[a.status]-ord[b.status]||(a.due<b.due?-1:1)).slice(0,6);
  const ch=S.changes.filter(c=>!c.seen),pt=(S.plan||[]).filter(p=>p.date===t),nx=(S.exams||[]).find(x=>x.date>=t);
  const greet=n.getHours()<5?"Good night":n.getHours()<12?"Good morning":n.getHours()<18?"Good afternoon":"Good evening";
  let prog="";if(cur){const s0=new Date(cur.start).getTime(),e0=new Date(cur.end).getTime();prog=`<div class="progress"><i style="width:${Math.max(0,Math.min(100,(n.getTime()-s0)/(e0-s0)*100)).toFixed(0)}%"></i></div>`}
  const hero=`<section class="hero-card"><div class="hello"><small>${greet}</small><h3>${n.toLocaleDateString(SSCUI.locale(),{weekday:"long",day:"numeric",month:"long"})}</h3>
    <small style="display:block;margin-top:8px">${(sm.missed||0)+(sm.soon||0)?`${(sm.missed||0)+(sm.soon||0)} homework item(s) need attention`:"Nothing urgent"}</small></div>
    <div class="nowbox">${e?`<small>${cur?"NOW":"NEXT"}</small><b>${esc(e.subject||"Lesson")}</b><div>${hmOf(e)}${e.date!==t?" · "+dayName(e.date):""} · ${esc(e.room)} ${esc(e.teacher)}</div>${prog}`:`<b>No more lessons</b><div>Enjoy your day.</div>`}</div></section>`;
  const tile=(k,label,val,sub,warn)=>`<button class="tile ${warn?"warn":""}" onclick="tab='${k}';render()"><small>${label}</small><b>${val}</b><span>${sub}</span></button>`;
  const tiles=`<div class="tiles">${tile("hw","Homework",(sm.missed||0)+(sm.soon||0)+(sm.pending||0),`${sm.missed||0} missed · ${sm.soon||0} due soon`,(sm.missed||0)>0)}
    ${tile("ex","Next exam",nx?dayName(nx.date):"-",nx?esc(nx.subject+" "+nx.text):"none planned")}
    ${tile("pl","Study plan today",pt.length,pt.length?pt.filter(p=>p.done).length+" done":"nothing planned")}
    ${tile("ch","Changes",ch.length,ch.length?"unseen":"all seen",ch.length>0)}</div>`;
  const left=`<h2>Today</h2>${lessonRows(t,now)}<h2>Tomorrow · ${dayName(tm)}</h2>${lessonRows(tm)}`;
  const right=(ch.length?`<h2>New changes</h2>`+ch.slice(0,6).map(chItem).join("")+`<button onclick="post('/api/seen').then(load)">Mark all seen</button>`:"")+limitsWarn()+planToday()+`<h2>Homework ${hwChips()}</h2>`+(hw.map(hwItem).join("")||`<p class="mut">Nothing open.</p>`);
  return hero+tiles+`<div class="dash"><div>${left}</div><div>${right}</div></div>`;
}
let fT="",fR="",fS="";
function tt(){
  const ws=Object.keys(S.timetable||{}).sort(); if(!ws.length)return empty();
  if(!ws.includes(wk)){const t=iso(new Date());wk=[...ws].reverse().find(w=>w<=t)||ws[0]}
  const all=allEntries(),opts=k=>[...new Set(all.flatMap(e=>String(e[k]).split(", ")).filter(Boolean))].sort();
  const sel=(v,k,l,set)=>`<select onchange="${set}=this.value;render()"><option value="">${l}</option>${opts(k).map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  const has=(e,k,v)=>!v||String(e[k]).split(", ").includes(v);
  const days={};(S.timetable[wk]||[]).filter(e=>has(e,"teacher",fT)&&has(e,"room",fR)&&has(e,"subject",fS)).forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  return `<div class="bar"><button onclick="shift(-1)">←</button><b>Week of ${wk}</b><button onclick="shift(1)">→</button>
   ${sel(fS,"subject","All subjects","fS")}${sel(fT,"teacher","All teachers","fT")}${sel(fR,"room","All rooms","fR")}</div><div class="week">`+
   Object.keys(days).sort().map(d=>`<div class="day ${d===iso(new Date())?"today":""}"><h3>${dayName(d)}${d===iso(new Date())?" · "+SSCUI.t("today"):""}</h3>${days[d].map(ent).join("")}</div>`).join("")+`</div>`;
}
function shift(n){const ws=Object.keys(S.timetable).sort(),i=ws.indexOf(wk)+n;if(ws[i]){wk=ws[i];render()}}
const HWL={missed:"Missed",soon:"Due soon",pending:"Pending",done:"Done"},HWC={missed:"var(--bad)",soon:"var(--warn)",pending:"var(--acc)",done:"var(--ok)"};
const shortDate=s=>s?new Date(s+"T12:00").toLocaleDateString(SSCUI.locale(),{day:"numeric",month:"short"}):"";
function dueText(h){const d=h.days_left,sd=shortDate(h.due);if(d===null||d===undefined)return "due "+sd;
  if(d===0)return "due today";if(d===1)return "due tomorrow";if(d>1)return "due in "+d+" days ("+sd+")";
  return (-d)+" day"+(d===-1?"":"s")+" overdue ("+sd+")"}
const hwChips=()=>{const m=S.homework_summary||{};return ["missed","soon","pending","done"].filter(k=>m[k]).map(k=>`<span class="badge" style="background:${HWC[k]}">${m[k]} <span>${HWL[k]}</span></span>`).join(" ")};
function subjChip(s){return s?`<span class="subj" style="--h:${hue(s)}">${esc(s)}</span>`:`<span class="subj none">No subject</span>`}
function hwItem(h){return `<div class="item hw ${h.status==="done"?"done":""}" style="border-left:4px solid ${HWC[h.status]}"><input type="checkbox" ${h.done?"checked":""} ${SNAP?"disabled":""} onchange="toggle('${esc(h.id)}',this.checked)" title="Mark done on this Mac">
  <div class="b"><div class="hw-top">${subjChip(h.subject)}<span class="badge" style="background:${HWC[h.status]}">${HWL[h.status]}</span><small class="due" style="${h.status==="missed"?"color:var(--bad)":""}">${esc(dueText(h))}</small></div>
  <div class="hw-text" translate="no">${esc(h.text)}</div>${h.remark?`<small>${esc(h.remark)}</small>`:""}${h.dismissed?`<small>dismissed ${h.dismiss_reason==="manual"?"by you":"automatically ("+(h.dismiss_reason==="done"?"done":"missed too long")+")"}</small>`:""}</div>
  ${SNAP?"":`<button onclick="planFromHw('${esc(h.id)}')" title="Add to study plan">+ Plan</button>${h.dismissed?`<button onclick="hwDismiss('${esc(h.id)}',true)">Restore</button>`:`<button onclick="hwDismiss('${esc(h.id)}')" title="Hide this homework">Dismiss</button>`}`}</div>`}
async function hwDismiss(id,restore){await post("/api/homework/"+(restore?"restore":"dismiss"),{id});await load()}
function hw(){
  if(!S.homework.length)return empty();
  const sm=S.homework_summary||{},subs=[...new Set(S.homework.map(h=>h.subject))].filter(Boolean).sort();
  const base=S.homework.filter(h=>!hwSub||h.subject===hwSub);
  const pick={todo:h=>!h.dismissed&&h.status!=="done",done:h=>h.status==="done",dismissed:h=>h.dismissed,all:()=>true}[hwFilter];
  const cnt={todo:(sm.missed||0)+(sm.soon||0)+(sm.pending||0),done:S.homework.filter(h=>h.status==="done").length,dismissed:sm.dismissed||0,all:S.homework.length};
  const l=base.filter(pick).filter(h=>!hwStatus||h.status===hwStatus);
  const tabs=Object.entries({todo:"To do",done:"Done",dismissed:"Dismissed",all:"All"}).map(([k,v])=>`<button class="${hwFilter===k?"on":""}" onclick="hwFilter='${k}';hwStatus='';render()"><span>${v}</span> (${cnt[k]})</button>`).join("");
  const chips=["missed","soon","pending","done"].map(k=>`<button class="${hwStatus===k?"on":""}" style="border-left:4px solid ${HWC[k]}" onclick="hwStatus=hwStatus==='${k}'?'':'${k}';render()"><span>${HWL[k]}</span> ${sm[k]||0}</button>`).join("");
  const grp=Object.entries({status:"By status",subject:"By subject",date:"By due date"}).map(([k,v])=>`<button class="${hwGroup===k?"on":""}" onclick="hwGroup='${k}';render()">${v}</button>`).join("");
  const order=["missed","soon","pending","done"],byDue=(a,b)=>a.due<b.due?-1:1;
  let groups;
  if(hwFilter==="dismissed")groups=[["",l.slice().sort((a,b)=>a.due<b.due?1:-1)]];
  else if(hwGroup==="subject")groups=[...new Set(l.map(h=>h.subject||""))].sort((a,b)=>a===b?0:!a?1:!b?-1:a.localeCompare(b)).map(sj=>["s:"+sj,l.filter(h=>(h.subject||"")===sj).sort(byDue)]);
  else if(hwGroup==="date")groups=[...new Set(l.map(h=>h.due))].sort().map(d=>["d:"+d,l.filter(h=>h.due===d)]);
  else groups=order.map(k=>[k,l.filter(h=>h.status===k).sort(byDue)]).filter(g=>g[1].length);
  const head=(k,items)=>!k?"":k[0]==="s"&&k[1]===":"?`<h2 class="gh">${subjChip(k.slice(2))} <span>· ${items.length}</span></h2>`:k[0]==="d"&&k[1]===":"?`<h2>${k.length>2&&k.slice(2)?dayName(k.slice(2)):""} · ${items.length}</h2>`:`<h2 style="color:${HWC[k]}">${HWL[k]} · ${items.length}</h2>`;
  return `<div class="bar">${tabs}<select onchange="hwSub=this.value;render()"><option value="">All subjects</option>${subs.map(s=>`<option ${s===hwSub?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
   <div class="bar">${chips}</div>
   <div class="bar"><span class="mut">Group</span>${grp}</div>
   <div class="bar"><span class="mut">Done and long-missed homework is dismissed automatically (change this in Settings).</span></div>`+
   (groups.map(([k,items])=>head(k,items)+items.map(hwItem).join("")).join("")||`<p class="mut">Nothing here.</p>`);
}
function hwSettings(){if(SNAP)return "";const c=S.homework_cfg||{soon_days:2,dismiss_done:true,dismiss_missed_days:7};
  return `<h2>Homework</h2><div class="item"><div class="b"><p class="mut">The status (done / due soon / pending / missed) comes from WebUntis when it reports one; otherwise it's worked out from the due date.</p>
   <div class="bar"><label>"Due soon" means due within <input type="number" id="hs1" min="0" max="14" style="width:70px" value="${c.soon_days}"> days</label></div>
   <div class="bar"><label><input type="checkbox" id="hs2" ${c.dismiss_done?"checked":""}> Dismiss homework automatically once it is done</label></div>
   <div class="bar"><label>Dismiss missed homework <input type="number" id="hs3" min="-1" max="365" style="width:80px" value="${c.dismiss_missed_days}"> days after its due date</label><small class="mut">(-1 = never)</small></div>
   <button class="on" onclick="saveHwCfg()">Save</button></div></div>`}
async function saveHwCfg(){const r=await post("/api/homework/settings",{soon_days:+$("#hs1").value,dismiss_done:$("#hs2").checked,dismiss_missed_days:+$("#hs3").value});
  if(!r.ok)return alert((await r.json()).error||"could not save");await load();tab="set";render()}
async function toggle(id,done){if(SNAP){S.homework.find(h=>h.id===id).done=done;return render()}await post("/api/done",{id,done});await load()}
function relDay(d){const t=iso(new Date()),n=Math.round((new Date(d+"T12:00")-new Date(t+"T12:00"))/864e5);
  return n===0?"today":n===1?"tomorrow":n===-1?"yesterday":n>1?"in "+n+" days":(-n)+" days ago"}
function examItem(x){const t=iso(new Date()),dt=x.date?new Date(x.date+"T12:00"):null,past=!!x.date&&x.date<t,L=SSCUI.locale();

  if(v.trim().length<3){$("#sres").innerHTML="";return}
  try{const r=await (await fetch("/api/schools?q="+encodeURIComponent(v))).json();
    $("#sres").innerHTML=Array.isArray(r)?(r.map(x=>`<div class="item"><div class="b"><b>${esc(x.name)}</b><small>${esc(x.address)}</small></div><button onclick="startLogin('${esc(x.server)}','${esc(x.school)}')">Log in</button></div>`).join("")||`<p class="mut">No schools found.</p>`):`<p class="mut">Search failed: ${esc(r.error||"")}</p>`}
  catch(e){$("#sres").innerHTML=`<p class="mut">Search needs an internet connection.</p>`}},350)}
async function startLogin(server,school){const r=await post("/api/login",{server,school,browser:$("#br").value});
  if(!r.ok)return alert("Invalid school or browser.");watchLogin()}
function watchLogin(){const t=setInterval(async()=>{CFG=await (await fetch("/api/config")).json();const l=CFG.login;
  if(l.running){$("#lst").textContent="Waiting for you to log in in the browser window… (the first run may download a browser)";return}
  clearInterval(t);if(l.ok){await doSync();await load()}else $("#lst").textContent="Login failed: "+lastErr(l.log)},1500);
  $("#lst").textContent="Waiting for you to log in in the browser window…"}
async function load(){
  if(SNAP){S=SNAP;$("#sync").style.display=$("#exp").style.display="none";banner("Offline copy from "+when()+" (read-only).");return render()}
  try{S=await (await fetch("/api/state")).json();CFG=await (await fetch("/api/config")).json();if(!BR.length)BR=await (await fetch("/api/browsers")).json()}
  catch(e){return banner("Can't reach the local server.")}
  if(!CFG.configured)return setupView();
  render()}
load().then(()=>{if(!SNAP&&CFG.configured)fetch("/api/sync").then(r=>r.json()).then(r=>{r.running?doSync(true):r.ok===false&&failed(r)})});
</script></body></html>
